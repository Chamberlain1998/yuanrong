kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: function-manager-{{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: function-manager
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: ClusterRole
  name: function-manager-{{ .Values.global.namespace }}
  apiGroup: rbac.authorization.k8s.io
